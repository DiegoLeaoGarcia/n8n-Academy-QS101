<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Warehouse Order Processing workflow architecture</title>
  <desc id="desc">Manual and scheduled triggers retrieve warehouse orders, route them by status and employee, persist selected orders, calculate totals, and send a Discord summary.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#172033"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker>
    <style>.heading{font:700 30px Inter,Segoe UI,sans-serif;fill:#f8fafc}.subtitle{font:400 16px Inter,Segoe UI,sans-serif;fill:#94a3b8}.label{font:700 17px Inter,Segoe UI,sans-serif;fill:#f8fafc}.detail{font:400 13px Inter,Segoe UI,sans-serif;fill:#cbd5e1}.tag{font:700 12px Inter,Segoe UI,sans-serif;fill:#dbeafe;letter-spacing:.06em}.line{fill:none;stroke:#94a3b8;stroke-width:3;marker-end:url(#arrow)}.card{stroke-width:2;rx:18;filter:url(#shadow)}</style>
  </defs>
  <rect width="1400" height="650" rx="28" fill="url(#background)"/><circle cx="1280" cy="70" r="150" fill="#ea4b71" opacity="0.08"/><circle cx="90" cy="600" r="180" fill="#0b8793" opacity="0.09"/>
  <text x="70" y="70" class="heading">Warehouse Order Processing</text><text x="70" y="103" class="subtitle">Authenticated retrieval, business routing, persistence, aggregation, and notification</text>
  <path class="line" d="M245 205H365"/><path class="line" d="M245 325C300 325 310 245 365 245"/><path class="line" d="M585 225H700"/><path class="line" d="M925 225H1020"/><path class="line" d="M815 295V380"/><path class="line" d="M925 455H1020"/>
  <rect class="card" x="70" y="155" width="175" height="100" fill="#172554" stroke="#3b82f6"/><text x="92" y="188" class="tag">ON DEMAND</text><text x="92" y="220" class="label">Manual trigger</text><text x="92" y="242" class="detail">Development and tests</text>
  <rect class="card" x="70" y="275" width="175" height="100" fill="#1e293b" stroke="#64748b"/><text x="92" y="308" class="tag">SCHEDULE</text><text x="92" y="340" class="label">Monday 09:00</text><text x="92" y="362" class="detail">Production execution</text>
  <rect class="card" x="365" y="165" width="220" height="120" fill="#12343b" stroke="#22c55e"/><text x="390" y="198" class="tag">HTTP REQUEST</text><text x="390" y="232" class="label">Warehouse API</text><text x="390" y="256" class="detail">GET • Header authentication</text>
  <rect class="card" x="700" y="155" width="225" height="140" fill="#3b2330" stroke="#ea4b71"/><text x="725" y="188" class="tag">BUSINESS RULE</text><text x="725" y="222" class="label">Status + employee</text><text x="725" y="247" class="detail">Processing orders assigned</text><text x="725" y="268" class="detail">to Mario follow the match path</text>
  <rect class="card" x="1020" y="155" width="300" height="140" fill="#30284a" stroke="#a78bfa"/><text x="1045" y="188" class="tag">MATCHED ORDERS</text><text x="1045" y="222" class="label">Upsert + selected totals</text><text x="1045" y="247" class="detail">Persist records without duplicates</text><text x="1045" y="268" class="detail">and calculate financial metrics</text>
  <rect class="card" x="700" y="380" width="225" height="150" fill="#3b2f18" stroke="#f59e0b"/><text x="725" y="413" class="tag">REMAINING ORDERS</text><text x="725" y="447" class="label">Aggregate totals</text><text x="725" y="472" class="detail">Count orders and calculate</text><text x="725" y="493" class="detail">the rounded total value</text>
  <rect class="card" x="1020" y="390" width="300" height="130" fill="#25304a" stroke="#5865f2"/><text x="1045" y="423" class="tag">NOTIFICATION</text><text x="1045" y="457" class="label">Discord summary</text><text x="1045" y="482" class="detail">Publish the operational report</text>
  <g transform="translate(70 570)"><rect width="1260" height="2" fill="#334155"/><circle cx="8" cy="35" r="6" fill="#22c55e"/><text x="24" y="40" class="detail">Completed QS101 Module 01 workflow</text><text x="1260" y="40" text-anchor="end" class="detail">n8n Academy portfolio</text></g>
</svg>
