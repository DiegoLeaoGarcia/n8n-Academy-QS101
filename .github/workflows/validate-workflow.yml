name: Validate n8n workflow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: find . -name workflow.json -print0 | xargs -0 -n1 jq empty

      - name: Check required workflow structure
        run: |
          find . -name workflow.json -print0 | while IFS= read -r -d '' workflow; do
            jq -e '
              (.name | type == "string" and length > 0) and
              (.nodes | type == "array" and length > 0) and
              (.connections | type == "object")
            ' "$workflow"
          done

      - name: Reject credential and instance metadata
        run: |
          find . -name workflow.json -print0 | while IFS= read -r -d '' workflow; do
            if jq -e '.. | objects |
              has("credentials") or
              has("instanceId") or
              has("webhookId") or
              has("cachedResultUrl") or
              has("errorWorkflow")
            ' "$workflow" | grep -q true; then
              echo "Sensitive n8n metadata detected in $workflow."
              exit 1
            fi
          done

      - name: Reject a real assessment ID
        run: |
          if find . -name workflow.json -print0 | xargs -0 grep -En '[a-f0-9]{32}'; then
            echo "Possible assessment ID detected."
            exit 1
          fi

      - name: Validate visual assets
        run: |
          find . -name '*.svg' -print0 | while IFS= read -r -d '' asset; do
            test -s "$asset" || {
              echo "Empty visual asset: $asset"
              exit 1
            }
            grep -q '<svg' "$asset" || {
              echo "Invalid SVG asset: $asset"
              exit 1
            }
          done

      - name: Validate local documentation links
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          failures = []
          for readme in pathlib.Path(".").rglob("README.md"):
              content = readme.read_text(encoding="utf-8")
              for target in re.findall(r"!?(?:\[[^]]*\])\((\./[^)#?]+)", content):
                  path = (readme.parent / target).resolve()
                  if not path.exists():
                      failures.append(f"{readme}: missing {target}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          PY
