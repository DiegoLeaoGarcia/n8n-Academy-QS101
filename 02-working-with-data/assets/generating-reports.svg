<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Generating Reports workflow architecture</title>
  <desc id="desc">Orders and customers are merged, calculated, sorted, and split into European report and regional summary branches.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f97316"/></marker><style>.t{font:700 20px Inter,Arial;fill:#fff}.h{font:700 30px Inter,Arial;fill:#fff}.s{font:500 14px Inter,Arial;fill:#cbd5e1}.n{fill:#273449;stroke:#475569;stroke-width:2;rx:16;filter:url(#shadow)}.e{fill:none;stroke:#f97316;stroke-width:3.5;marker-end:url(#arrow)}.tag{font:700 14px Inter,Arial;fill:#fdba74}</style></defs>
  <rect width="1500" height="760" rx="28" fill="url(#bg)"/><text x="55" y="60" class="h">02 · Working with Data — Generating Reports</text><text x="55" y="88" class="s">Two-source enrichment with parallel reporting branches</text>
  <path class="e" d="M210 245 C260 245 270 190 320 190"/><path class="e" d="M210 245 C260 245 270 300 320 300"/><path class="e" d="M500 190 C550 190 555 245 605 245"/><path class="e" d="M500 300 C550 300 555 245 605 245"/><path class="e" d="M785 245 H850"/><path class="e" d="M1030 245 H1095"/>
  <path class="e" d="M1275 245 C1330 245 1300 155 1360 155"/><path class="e" d="M1275 245 C1330 245 1300 475 330 475"/>
  <path class="e" d="M1360 205 V270"/><path class="e" d="M1360 370 V435"/>
  <path class="e" d="M510 475 H575"/><path class="e" d="M755 475 C815 475 805 420 865 420"/><path class="e" d="M755 475 C815 475 805 590 865 590"/><path class="e" d="M1045 590 H1110"/>
  <g><rect class="n" x="45" y="195" width="165" height="100"/><text x="128" y="239" text-anchor="middle" class="t">ManualTrigger</text><text x="128" y="268" text-anchor="middle" class="s">Start</text></g>
  <g><rect class="n" x="320" y="140" width="180" height="100"/><text x="410" y="184" text-anchor="middle" class="t">GetOrderData</text><text x="410" y="213" text-anchor="middle" class="s">HTTP · 30 orders</text></g>
  <g><rect class="n" x="320" y="250" width="180" height="100"/><text x="410" y="294" text-anchor="middle" class="t">GetCustomers</text><text x="410" y="323" text-anchor="middle" class="s">Data Table · 10 rows</text></g>
  <g><rect class="n" x="605" y="195" width="180" height="100"/><text x="695" y="239" text-anchor="middle" class="t">Merge</text><text x="695" y="268" text-anchor="middle" class="s">Match customerID</text></g>
  <g><rect class="n" x="850" y="195" width="180" height="100"/><text x="940" y="239" text-anchor="middle" class="t">CalculateTotal</text><text x="940" y="268" text-anchor="middle" class="s">Price × quantity</text></g>
  <g><rect class="n" x="1095" y="195" width="180" height="100"/><text x="1185" y="239" text-anchor="middle" class="t">SortByTotal</text><text x="1185" y="268" text-anchor="middle" class="s">Descending</text></g>
  <text x="1325" y="117" class="tag">EUROPEAN REPORT</text><g><rect class="n" x="1360" y="105" width="120" height="100"/><text x="1420" y="148" text-anchor="middle" class="t" font-size="17">EuropeOnly</text><text x="1420" y="176" text-anchor="middle" class="s">12 orders</text></g>
  <g><rect class="n" x="1300" y="270" width="180" height="100"/><text x="1390" y="314" text-anchor="middle" class="t">ConvertToCSV</text><text x="1390" y="343" text-anchor="middle" class="s">Binary file</text></g>
  <g><rect class="n" x="1300" y="435" width="180" height="100"/><text x="1390" y="479" text-anchor="middle" class="t">UploadReport</text><text x="1390" y="508" text-anchor="middle" class="s">Authenticated POST</text></g>
  <text x="330" y="435" class="tag">REGIONAL SUMMARY</text><g><rect class="n" x="330" y="425" width="180" height="100"/><text x="420" y="468" text-anchor="middle" class="t" font-size="18">SummarizeByRegion</text><text x="420" y="497" text-anchor="middle" class="s">4 regions</text></g>
  <g><rect class="n" x="575" y="425" width="180" height="100"/><text x="665" y="469" text-anchor="middle" class="t">SortSummary</text><text x="665" y="498" text-anchor="middle" class="s">Highest total first</text></g>
  <g><rect class="n" x="865" y="370" width="180" height="100"/><text x="955" y="414" text-anchor="middle" class="t">SummaryToCSV</text><text x="955" y="443" text-anchor="middle" class="s">Archive-ready</text></g>
  <g><rect class="n" x="865" y="540" width="180" height="100"/><text x="955" y="583" text-anchor="middle" class="t" font-size="17">BuildDiscordMessage</text><text x="955" y="612" text-anchor="middle" class="s">Formatted summary</text></g>
  <g><rect class="n" x="1110" y="540" width="180" height="100"/><text x="1200" y="584" text-anchor="middle" class="t">SendToDiscord</text><text x="1200" y="613" text-anchor="middle" class="s">4 notifications</text></g>
</svg>
