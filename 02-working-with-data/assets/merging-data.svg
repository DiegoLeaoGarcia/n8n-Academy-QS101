<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Merging Data workflow architecture</title>
  <desc id="desc">Customer records and country data are merged and written back to the customer table.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f97316"/></marker>
    <style>.t{font:700 23px Inter,Arial;fill:#fff}.s{font:500 15px Inter,Arial;fill:#cbd5e1}.n{fill:#273449;stroke:#475569;stroke-width:2;rx:18;filter:url(#shadow)}.a{fill:none;stroke:#f97316;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="55" y="60" class="t" font-size="30">02 · Working with Data — Merging Data</text>
  <text x="55" y="88" class="s">Customer enrichment pipeline</text>
  <path class="a" d="M245 210 C310 210 320 155 385 155"/><path class="a" d="M245 210 C310 210 320 275 385 275"/>
  <path class="a" d="M590 155 C675 155 660 210 745 210"/><path class="a" d="M590 275 C675 275 660 210 745 210"/><path class="a" d="M950 210 H1030"/>
  <g><rect class="n" x="55" y="160" width="190" height="100"/><text x="150" y="204" text-anchor="middle" class="t">Manual Trigger</text><text x="150" y="234" text-anchor="middle" class="s">Start workflow</text></g>
  <g><rect class="n" x="385" y="105" width="205" height="100"/><text x="488" y="149" text-anchor="middle" class="t">GetCustomers</text><text x="488" y="179" text-anchor="middle" class="s">Data Table · 10 rows</text></g>
  <g><rect class="n" x="385" y="225" width="205" height="100"/><text x="488" y="269" text-anchor="middle" class="t">GetCountries</text><text x="488" y="299" text-anchor="middle" class="s">HTTP · 249 countries</text></g>
  <g><rect class="n" x="745" y="160" width="205" height="100"/><text x="848" y="204" text-anchor="middle" class="t">Merge</text><text x="848" y="234" text-anchor="middle" class="s">Match country names</text></g>
  <g><rect class="n" x="1030" y="160" width="145" height="100"/><text x="1103" y="202" text-anchor="middle" class="t" font-size="19">Update</text><text x="1103" y="229" text-anchor="middle" class="t" font-size="19">Customers</text></g>
</svg>
