<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Error Monitoring workflow architecture</title><desc id="desc">An error trigger formats failure data and sends a Discord alert.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1f2937"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/></marker><style>.t{font:700 23px Inter,Arial;fill:#fff}.s{font:500 15px Inter,Arial;fill:#cbd5e1}.n{fill:#273449;stroke:#475569;stroke-width:2;rx:18;filter:url(#shadow)}.a{fill:none;stroke:#ef4444;stroke-width:4;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="380" rx="28" fill="url(#bg)"/><text x="55" y="60" class="t" font-size="30">02 · Working with Data — Error Monitoring</text><text x="55" y="88" class="s">Reusable production failure notification</text>
  <path class="a" d="M345 220 H440"/><path class="a" d="M760 220 H855"/>
  <g><rect class="n" x="55" y="165" width="290" height="110"/><text x="200" y="211" text-anchor="middle" class="t">Error Trigger</text><text x="200" y="242" text-anchor="middle" class="s">Capture production failure</text></g>
  <g><rect class="n" x="440" y="165" width="320" height="110"/><text x="600" y="211" text-anchor="middle" class="t">BuildErrorMessage</text><text x="600" y="242" text-anchor="middle" class="s">Workflow · error · node · URL</text></g>
  <g><rect class="n" x="855" y="165" width="290" height="110"/><text x="1000" y="211" text-anchor="middle" class="t">NotifyDiscord</text><text x="1000" y="242" text-anchor="middle" class="s">Send actionable alert</text></g>
</svg>
